<!doctype html>
<html lang='es'>
<head>
  <meta charset='utf-8' />
  <meta name='viewport' content='width=device-width,initial-scale=1' />
  <title>Salca Academy - Elite Management</title>
  <link href='https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;600&display=swap' rel='stylesheet'>
  <style>
    :root {
      --primary: #0056ff; --accent: #00d4ff; --bg-dark: #050507;
      --card-bg: rgba(15, 15, 25, 0.8); --text-main: #e0e0e0; --neon-shadow: 0 0 15px rgba(0, 86, 255, 0.4);
      --danger: #ff4444;
    }
    body { font-family: 'Montserrat', sans-serif; background: radial-gradient(circle at top, #0a0a15 0%, #050507 100%); margin: 0; padding: 40px 20px; color: var(--text-main); min-height: 100vh; position: relative; }

    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #050507; display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 1s ease, visibility 1s;
    }
    .sc-logo {
      font-family: 'Cinzel', serif; font-size: 8em; color: #fff;
      text-shadow: 0 0 20px var(--primary), 0 0 40px var(--accent);
      animation: pulse 2s infinite alternate, scaleUp 1.5s ease-out;
      letter-spacing: 10px;
    }
    @keyframes pulse {
      from { text-shadow: 0 0 10px var(--primary); opacity: 0.8; }
      to { text-shadow: 0 0 30px var(--accent), 0 0 50px #fff; opacity: 1; }
    }
    @keyframes scaleUp {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .fade-out { opacity: 0; visibility: hidden; }

    .container { max-width: 950px; margin: auto; position: relative; z-index: 1; display: none; }
    .header-brand { text-align: center; margin-bottom: 40px; }
    .header-brand h1 { font-family: 'Cinzel', serif; letter-spacing: 12px; color: #fff; text-shadow: var(--neon-shadow); margin: 0; }
    .card { background: var(--card-bg); backdrop-filter: blur(15px); padding: 30px; border-radius: 20px; border: 1px solid rgba(0, 86, 255, 0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 30px; }
    input, select, textarea { background: rgba(255,255,255,0.05); border: 1px solid #333; padding: 12px; border-radius: 8px; color: #fff; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
    label { display: block; margin: 10px 0 5px; font-size: 0.8em; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
    .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; text-transform: uppercase; font-size: 0.75em; }
    .btn-main { background: var(--primary); color: #fff; box-shadow: var(--neon-shadow); }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
    .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-main:hover { background: var(--accent); transform: translateY(-2px); }
    
    .w-100 { width: 100%; }
    .mt-3 { margin-top: 15px; }
    .mb-3 { margin-bottom: 15px; }
    .text-center { text-align: center; }
    
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--accent); padding: 15px; font-size: 0.8em; letter-spacing: 2px; }
    td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; overflow-y: auto; }
    .modal-content { background: #0a0a0f; border: 1px solid var(--primary); padding: 35px; border-radius: 24px; width: 90%; max-width: 600px; margin: 20px; }
    .payment-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #222; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .user-badge { color: var(--accent); font-size: 0.85em; font-weight: 600; letter-spacing: 1px; }
  </style>
</head>
<body>

<div id='splash-screen'><div class='sc-logo'>SC</div></div>

<!-- PANTALLA 1: INICIO DE SESIÓN -->
<div class='container' id='login-screen' style='margin-top: 80px;'>
  <div class='header-brand'>
    <h1>SALCA</h1>
    <p style='color:var(--accent); letter-spacing:3px; margin-top:5px;'>ACCESO A LA PLATAFORMA</p>
  </div>

  <div class='card' style='max-width: 400px; margin: auto; text-align: center;'>
    <h3 style='font-family: Cinzel; margin-top: 0;'>INICIAR SESIÓN</h3>
    <input type='email' id='loginEmail' placeholder='Correo electrónico'>
    <input type='password' id='loginPassword' placeholder='Contraseña'>
    <button class='btn btn-main w-100 mt-3' id='btnLogin'>Entrar</button>
    <p id='loginError' style='color: var(--danger); display: none; margin-top: 15px; font-size: 0.85em;'></p>
  </div>
</div>

<!-- PANTALLA 2: PANEL DE ADMINISTRADOR -->
<div class='container' id='admin-screen'>
  <div class='top-bar'>
    <div class='user-badge'>BIENVENIDO, ADMINISTRADOR</div>
    <button class='btn btn-outline' id='btnLogoutAdmin'>Cerrar Sesión</button>
  </div>

  <div class='header-brand'>
    <h1>SALCA</h1>
    <p style='color:var(--accent); letter-spacing:3px; margin-top:5px;'>FUNDACIÓN Y ESCUELA DE BAILE</p>
  </div>

  <div class='card' style='display:flex; gap:10px; align-items: center;'>
    <input type='text' id='fullName' placeholder='Nombre del Alumno'>
    <input type='text' id='idNumber' placeholder='ID/Cédula'>
    <button class='btn btn-main' onclick='saveMember()'>Registrar</button>
  </div>

  <div class='card'><table id='membersTable'><thead><tr><th>BAILARÍN</th><th>ID</th><th>GESTIÓN</th></tr></thead><tbody></tbody></table></div>
</div>

<!-- PANTALLA 3: PANEL DE BAILARÍN -->
<div class='container' id='dancer-screen'>
  <div class='top-bar'>
    <div class='user-badge'>ÁREA DEL BAILARÍN</div>
    <button class='btn btn-outline' id='btnLogoutDancer'>Cerrar Sesión</button>
  </div>

  <div class='header-brand'>
    <h1>SALCA</h1>
    <p style='color:var(--accent); letter-spacing:3px; margin-top:5px;'>MI ESPACIO</p>
  </div>

  <div class='card text-center'>
    <h2 style='font-family: Cinzel; color: var(--accent);'>Bienvenido a tu perfil</h2>
    <p>Pronto podrás ver tu ficha técnica y estado de pagos aquí.</p>
  </div>
</div>

<!-- MODAL PARA ADMINISTRADOR -->
<div id='modal' class='modal'><div class='modal-content' id='modalBody'></div></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBgPpCg0-4h5x5Dktfw0xDkbhdeJeQxYt4",
    authDomain: "salca-2c2b0.firebaseapp.com",
    projectId: "salca-2c2b0",
    storageBucket: "salca-2c2b0.firebasestorage.app",
    messagingSenderId: "114834351748",
    appId: "1:114834351748:web:09ea47961b5ff0bd8a84d1",
    measurementId: "G-6BZ87WJXW4"
  };
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const dbFirestore = getFirestore(app);

  setTimeout(() => { document.getElementById('splash-screen').classList.add('fade-out'); }, 2000);

  const loginScreen = document.getElementById('login-screen');
  const adminScreen = document.getElementById('admin-screen');
  const dancerScreen = document.getElementById('dancer-screen');

  function hideAllScreens() {
    loginScreen.style.display = 'none';
    adminScreen.style.display = 'none';
    dancerScreen.style.display = 'none';
  }

  document.getElementById('btnLogin').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errorText = document.getElementById('loginError');
    const btn = document.getElementById('btnLogin');

    if (!email || !password) {
      errorText.innerText = "Por favor ingresa correo y contraseña.";
      errorText.style.display = 'block';
      return;
    }

    btn.innerText = "Verificando...";
    errorText.style.display = 'none';

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      btn.innerText = "Entrar";
      errorText.innerText = "Error: Correo o contraseña incorrectos.";
      errorText.style.display = 'block';
    }
  });

  const logout = async () => {
    await signOut(auth);
    hideAllScreens();
    loginScreen.style.display = 'block';
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('btnLogin').innerText = "Entrar";
  };
  document.getElementById('btnLogoutAdmin').addEventListener('click', logout);
  document.getElementById('btnLogoutDancer').addEventListener('click', logout);

  let dbCache = []; 
  let unsubscribeEstudiantes = null; // Para controlar el flujo de escucha en tiempo real

  window.formatLongDate = (dateStr) => {
    if(!dateStr) return 'N/A';
    const date = new Date(dateStr);
    return date.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  };

  function iniciarEscuchadorEstudiantes() {
    // Si ya había un escuchador previo, lo desconectamos para evitar duplicados
    if (unsubscribeEstudiantes) unsubscribeEstudiantes();

    unsubscribeEstudiantes = onSnapshot(collection(dbFirestore, "estudiantes"), (snapshot) => {
      dbCache = [];
      snapshot.forEach((docSnap) => {
        dbCache.push({ idFirebase: docSnap.id, ...docSnap.data() });
      });
      renderTable();
    }, (error) => {
      console.error("Error en tiempo real (posible permiso denegado):", error);
    });
  }

  window.renderTable = function() {
    const tbody = document.querySelector('#membersTable tbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    dbCache.forEach((m, i) => {
      tbody.insertAdjacentHTML('beforeend', `
        <tr>
          <td style='font-weight:600;'>${m.fullName}</td>
          <td style='color:#888;'>${m.idNumber}</td>
          <td class='actions-cell' style='display:flex; gap:8px;'>
            <button class='btn btn-main' onclick='openPayments(${i})'>PAGOS</button>
            <button class='btn btn-outline' onclick='openProfile(${i})'>FICHA</button>
            <button class='btn btn-danger' onclick='deleteMember(${i})'>✕</button>
          </td>
        </tr>`);
    });
  }

  window.saveMember = async function() {
    const n = document.getElementById('fullName').value; 
    if(!n) return;
    const idNum = document.getElementById('idNumber').value;
    
    try {
      await addDoc(collection(dbFirestore, "estudiantes"), {
        fullName: n,
        idNumber: idNum,
        months: [],
        health: '',
        tel: '',
        level: 'Básico',
        groupType: 'Baile Social'
      });
      document.getElementById('fullName').value = ''; 
      document.getElementById('idNumber').value = '';
    } catch (error) {
      console.error("Error al registrar estudiante:", error);
      alert("Hubo un error al guardar en la nube. Verifica tus permisos.");
    }
  }

  window.deleteMember = async (i) => {
    const m = dbCache[i];
    if(confirm(`¿Eliminar a ${m.fullName}?`)) {
      try {
        await deleteDoc(doc(dbFirestore, "estudiantes", m.idFirebase));
      } catch (error) {
        console.error("Error al eliminar:", error);
      }
    }
  };

  window.addNewMonth = async (i) => {
    const m = dbCache[i];
    const hoy = new Date();
    let mesSig = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 5);
    
    if (!m.months) m.months = [];
    
    m.months.push({ mes: 'Mensualidad', estado: 'Pendiente', fechaVence: mesSig.toISOString() });
    
    try {
      await updateDoc(doc(dbFirestore, "estudiantes", m.idFirebase), { months: m.months });
      openPayments(i);
    } catch (error) {
      console.error("Error al agregar mes:", error);
    }
  };

  window.openPayments = (i) => {
    const m = dbCache[i];
    let rows = (m.months || []).map((mon, mi) => `<div class='payment-row'><div><b>${mon.mes}</b><br><small style='color:#888;'>Vence: ${formatLongDate(mon.fechaVence)}</small></div><div>${mon.estado === 'Pagado' ? `<span style='color:#34c759; margin-right:10px;'>PAGADO</span><button class='btn' onclick='printReceipt(${i},${mi})'>RECIBO</button>` : `<button class='btn btn-main' onclick='payMonth(${i},${mi})'>PAGAR</button>`}</div></div>`).join('');
    document.getElementById('modalBody').innerHTML = `<h2 style='font-family:Cinzel; margin:0;'>Pagos: ${m.fullName}</h2><button class='btn btn-main' style='width:100%; margin:20px 0;' onclick='addNewMonth(${i})'>+ AGREGAR MES</button><div style='max-height:300px; overflow-y:auto;'>${rows || 'Sin registros.'}</div><br><button class='btn' style='background:#222; color:#fff;' onclick='closeModal()'>CERRAR</button>`;
    document.getElementById('modal').style.display = 'flex';
  };

  window.openProfile = (i) => {
    const m = dbCache[i];
    document.getElementById('modalBody').innerHTML = `
      <h2 style='font-family:Cinzel; margin:0;'>Ficha Técnica</h2>
      <div style='margin-top:20px; max-height: 450px; overflow-y: auto;'>
        <div class='grid-2'><div><label>Teléfono:</label><input type='text' id='tel' value='${m.tel||''}'></div><div><label>Nacimiento:</label><input type='date' id='birth' value='${m.birth||''}'></div></div>
        <div class='grid-2'><div><label>EPS:</label><input type='text' id='eps' value='${m.eps||''}'></div><div><label>Grupo:</label><select id='groupType'><option ${m.groupType==='Baile Social'?'selected':''}>Baile Social</option><option ${m.groupType==='Grupo Competitivo'?'selected':''}>Grupo Competitivo</option></select></div></div>
        <label>Responsable:</label><input type='text' id='respName' value='${m.respName||''}'>
        <label>Tel. Responsable:</label><input type='text' id='respTel' value='${m.respTel||''}'>
        <label>Nivel:</label><select id='level'><option ${m.level==='Básico'?'selected':''}>Básico</option><option ${m.level==='Intermedio'?'selected':''}>Intermedio</option><option ${m.level==='Avanzado'?'selected':''}>Avanzado</option></select>
        <label>Salud/Observaciones:</label><textarea id='health' rows='3'>${m.health||''}</textarea>
      </div>
      <button class='btn btn-main' style='width:100%; margin-top:20px;' onclick='saveProfile(${i})'>GUARDAR</button>
      <button class='btn' style='background:#222; color:#fff; width:100%; margin-top:10px;' onclick='closeModal()'>CANCELAR</button>`;
    document.getElementById('modal').style.display = 'flex';
  };

  window.saveProfile = async (i) => {
    const m = dbCache[i];
    m.tel = document.getElementById('tel').value; 
    m.birth = document.getElementById('birth').value; 
    m.eps = document.getElementById('eps').value; 
    m.groupType = document.getElementById('groupType').value;
    m.respName = document.getElementById('respName').value; 
    m.respTel = document.getElementById('respTel').value; 
    m.health = document.getElementById('health').value; 
    m.level = document.getElementById('level').value;
    
    try {
      await updateDoc(doc(dbFirestore, "estudiantes", m.idFirebase), {
        tel: m.tel, birth: m.birth, eps: m.eps, groupType: m.groupType,
        respName: m.respName, respTel: m.respTel, health: m.health, level: m.level
      });
      closeModal(); 
      alert('Ficha actualizada en la nube');
    } catch (error) {
      console.error("Error al guardar perfil:", error);
    }
  };

  window.payMonth = async (mi, moni) => { 
    const m = dbCache[mi];
    m.months[moni].estado = 'Pagado'; 
    m.months[moni].fechaPago = new Date().toISOString(); 
    
    try {
      await updateDoc(doc(dbFirestore, "estudiantes", m.idFirebase), { months: m.months });
      openPayments(mi); 
    } catch (error) {
      console.error("Error al pagar mes:", error);
    }
  };

  window.printReceipt = (mi, moni) => {
    const m = dbCache[mi]; const p = m.months[moni];
    const win = window.open('', '', 'width=600,height=550');
    win.document.write("<html><head><style>body { font-family: Montserrat; text-align: center; padding: 20px; color: #333; } .receipt-box { border: 2px solid #000; padding: 25px; min-height: 400px; position: relative; } .title { font-family: Cinzel; font-size: 2.2em; font-weight: bold; margin-bottom: 5px; } .subtitle { letter-spacing: 2px; font-size: 0.8em; margin-bottom: 20px; } .details { text-align: left; margin-top: 30px; line-height: 1.8; font-size: 1.1em; border-top: 1px dashed #ccc; padding-top: 15px; } .bottom-container { display: flex; justify-content: space-between; flex-direction: row-reverse; align-items: flex-end; margin-top: 40px; } .signature-box { width: 160px; height: 60px; border: 1px solid #000; position: relative; } .signature-label { position: absolute; bottom: -20px; width: 100%; font-size: 0.7em; font-weight: bold; text-align: center; } .stamp { border: 2px solid #000; padding: 5px 15px; font-weight: bold; text-transform: uppercase; font-size: 0.8em; }</style></head><body><div class='receipt-box'><div class='title'>SALCA</div><div class='subtitle'>FUNDACIÓN Y ESCUELA DE BAILE</div><div class='details'><b>ALUMNO:</b> " + m.fullName.toUpperCase() + "<br><b>CONCEPTO:</b> PAGO DE MENSUALIDAD<br><b>FECHA DE PAGO:</b> " + formatLongDate(p.fechaPago) + "<br><b>VIGENCIA HASTA:</b> " + formatLongDate(p.fechaVence) + "</div><div class='bottom-container'><div class='signature-box'><div class='signature-label'>FIRMA O SELLO</div></div><div class='stamp'>Comprobante Oficial</div></div></div></body></html>");
    win.document.close(); setTimeout(() => { win.print(); win.close(); }, 800);
  };

  window.closeModal = function() { document.getElementById('modal').style.display = 'none'; }

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      try {
        const userDoc = await getDoc(doc(dbFirestore, "usuarios", user.uid));
        hideAllScreens();
        
        if (userDoc.exists()) {
          const rol = userDoc.data().rol;
          
          if (rol === 'admin') {
            adminScreen.style.display = 'block';
            iniciarEscuchadorEstudiantes(); // Activa la sincronización en tiempo real para el Administrador
          } else {
            dancerScreen.style.display = 'block';
          }
        } else {
          dancerScreen.style.display = 'block'; 
        }
      } catch (error) {
        console.error("Error al obtener el rol:", error);
      }
    } else {
      if (unsubscribeEstudiantes) unsubscribeEstudiantes(); // Desconecta si cierran sesión
      hideAllScreens();
      loginScreen.style.display = 'block';
    }
  });
</script>
</body>
</html>
